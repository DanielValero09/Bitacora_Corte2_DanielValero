# PostgreSQL usa el DNS del servicio Compose, no localhost.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:american_bites}
spring.datasource.username=${DB_USER:postgres}

# Credenciales y authSource se suministran en una URI completa, sin fallback local.
spring.data.mongodb.uri=${MONGODB_URI}

# DB_PASSWORD, JWT_SECRET, JWT_EXPIRATION_MS, SSL_ENABLED y bootstrap.admin.*
# conservan los placeholders de application.properties; no duplicarlos aqui.
