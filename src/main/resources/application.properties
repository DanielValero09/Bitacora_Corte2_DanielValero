spring.datasource.url=jdbc:postgresql://localhost:5432/american_bites
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/american_bites}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# HTTP por defecto; solo SSL_ENABLED=true importa el keystore y el puerto HTTPS.
server.ssl.enabled=${SSL_ENABLED:false}
spring.config.import=optional:classpath:application-ssl-${SSL_ENABLED:false}.properties
